name = "syndigo-connector-api"
main = "worker.js"
compatibility_date = "2024-09-01"
keep_vars = true

[[kv_namespaces]]
binding  = "SYNDIGO_PRODUCTS"
id       = "d0313dc781e8427791dd61d0a1d1d12d"

# Vars — set in Cloudflare dashboard → Settings → Variables:
#   PROD_BASE_URL    = https://<prod-tenant>.syndigo.com
#   NONPROD_BASE_URL = https://<nonprod-tenant>.syndigo.com

# Secrets — set in Cloudflare dashboard → Settings → Variables (check "Secret"):
#   PROD_TENANT          NONPROD_TENANT
#   PROD_CLIENT_ID       NONPROD_CLIENT_ID
#   PROD_CLIENT_SECRET   NONPROD_CLIENT_SECRET
#   KV_SECRET  — shared password the dashboard must send (x-kv-secret) to read/write products
